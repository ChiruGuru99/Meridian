name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, property, concurrency and Testcontainers tests
        run: make test-ledger

  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: payment-gateway/go.mod
          cache-dependency-path: payment-gateway/go.sum
      - name: Vet, unit, rapid property and Testcontainers tests
        run: make test-gateway

  reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make test-recon

  ops-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ops-console/package-lock.json
      - run: make test-console

  system:
    needs: [ledger, gateway, reconciliation, ops-console]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: payment-gateway/go.mod
          cache-dependency-path: payment-gateway/go.sum
      - name: Start the stack
        run: make up
      - name: End-to-end tests
        run: make e2e
      - name: Demo script (includes a compensated payout and a reconciliation run)
        run: make demo
      - name: Failure tests
        run: make chaos
      - name: Load test (short)
        run: docker compose --profile tools run --rm -e DURATION=30s k6 run /scripts/load.js
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
