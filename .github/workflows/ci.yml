name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, property, concurrency and Testcontainers tests
        run: make test-ledger

  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: payment-gateway/go.mod
          cache-dependency-path: payment-gateway/go.sum
      - name: Vet, unit, rapid property and Testcontainers tests
        run: make test-gateway

  reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make test-recon

  system:
    needs: [ledger, gateway, reconciliation]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: payment-gateway/go.mod
          cache-dependency-path: payment-gateway/go.sum
      - name: Start the stack
        run: make up
      - name: End-to-end tests
        run: make e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
