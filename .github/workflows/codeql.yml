name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: payment-gateway/go.mod
          cache-dependency-path: payment-gateway/go.sum
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Go sources
        if: matrix.language == 'go'
        working-directory: payment-gateway
        run: go build ./...
      - name: Compile Java sources
        if: matrix.language == 'java-kotlin'
        run: mvn -B -ntp -f ledger-service/pom.xml -DskipTests compile
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
