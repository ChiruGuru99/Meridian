global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["ledger-service:8081"] }]
  - job_name: payment-gateway
    static_configs: [{ targets: ["payment-gateway:8082"] }]
  - job_name: rail-sim
    static_configs: [{ targets: ["rail-sim:8084"] }]
  - job_name: reconciliation
    static_configs: [{ targets: ["reconciliation:8083"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]
