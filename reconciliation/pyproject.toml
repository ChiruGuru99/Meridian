[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-recon"
version = "1.0.0"
description = "Meridian reconciliation: ledger event ingestion, bank statement simulator, and reconciliation job"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]==3.3.6",
    "confluent-kafka==2.16.0",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "testcontainers[postgres]==4.15.0"]

[tool.setuptools]
packages = ["recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
